name: transformer-course-production
services:
  course:
    build:
      context: .
      dockerfile: docker/production.Dockerfile
    ports:
      - "127.0.0.1:18080:8080"
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/course"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
